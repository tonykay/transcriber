[project]
name = "transcriber"
version = "0.1.0"
description = "Voice capture and processing system for DJI audio recordings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
stt-parakeet = ["parakeet-mlx>=0.1.0"]
stt-whisper = ["openai-whisper>=20231117"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
]

[project.scripts]
transcriber = "transcriber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.hatch.build.targets.wheel.force-include]
"src/transcriber/builtin_templates" = "transcriber/builtin_templates"
"src/transcriber/builtin_intents.yaml" = "transcriber/builtin_intents.yaml"
"src/transcriber/builtin_dictionaries" = "transcriber/builtin_dictionaries"
"src/transcriber/builtin_modelfiles" = "transcriber/builtin_modelfiles"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
